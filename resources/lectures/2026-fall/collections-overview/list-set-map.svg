<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">Список, множество и отображение</title><desc id="desc">В списке Иван, Анна, Иван — три позиции. Множество двух равных групп содержит одно логическое значение. Отображение связывает два ID с двумя студентами. Внутреннее устройство и порядок hash-коллекций не показаны.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="550" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Список, множество и отображение</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#65717d" text-anchor="start">Одни данные — разные вопросы к контейнеру.</text><rect x="40" y="130" width="300" height="335" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="60" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#26323d" text-anchor="start">List&lt;Student&gt;</text><text x="60" y="206" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">Позиции и повторы</text><rect x="400" y="130" width="300" height="335" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="420" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#26323d" text-anchor="start">Set&lt;UniversityGroup&gt;</text><text x="420" y="206" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">Уникальность по equals</text><rect x="760" y="130" width="300" height="335" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="780" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#26323d" text-anchor="start">Map&lt;Integer,Student&gt;</text><text x="780" y="206" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">Уникальные ключи</text><text x="64" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">0  →  Иван</text><text x="64" y="319" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">1  →  Анна</text><text x="64" y="373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">2  →  Иван</text><text x="64" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">size() = 3</text><rect x="420" y="244" width="260" height="85" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="550" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#26323d" text-anchor="middle">24.Б11-мм</text><text x="420" y="371" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#26323d" text-anchor="start">Повторное равное значение</text><text x="420" y="399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">не добавляется.</text><text x="420" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">size() = 1</text><text x="780" y="266" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">1  →  Иван</text><text x="780" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">2  →  Анна</text><text x="780" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">Поиск по ID</text><text x="780" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">size() = 2</text><text x="40" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Это логическое содержимое. Порядок HashSet и HashMap не гарантирован.</text>
</svg>
