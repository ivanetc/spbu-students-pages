<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">Очередь и стек на двухсторонней очереди</title><desc id="desc">В FIFO добавление справа offerLast, извлечение слева pollFirst. В LIFO push и pop работают с левым концом. Прямоугольники отражают логический порядок, а не массив или узлы.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="670" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Очередь и стек на двухсторонней очереди</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#65717d" text-anchor="start">Один Deque поддерживает разные дисциплины работы с концами.</text><text x="40" y="151" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Очередь FIFO</text><text x="40" y="187" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">раньше добавлен → раньше извлечён</text><rect x="280" y="218" width="160" height="74" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="360" y="264" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Иван</text><rect x="465" y="218" width="160" height="74" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="545" y="264" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Анна</text><rect x="650" y="218" width="160" height="74" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="730" y="264" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Гость</text><line x1="270" y1="255" x2="92" y2="255" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="40" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">pollFirst()</text><line x1="1010" y1="255" x2="825" y2="255" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="870" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">offerLast()</text><text x="40" y="405" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Стек LIFO</text><text x="40" y="441" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">позже добавлен → раньше извлечён</text><rect x="280" y="472" width="160" height="74" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="360" y="518" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Гость</text><rect x="465" y="472" width="160" height="74" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="545" y="518" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Анна</text><rect x="650" y="472" width="160" height="74" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="730" y="518" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">Иван</text><line x1="95" y1="487" x2="270" y2="487" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><line x1="270" y1="532" x2="95" y2="532" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="40" y="583" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">push() / pop()</text><text x="40" y="634" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">В примерах — ArrayDeque. Контракт Queue сам по себе не обещает FIFO.</text>
</svg>
