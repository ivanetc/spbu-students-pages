<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-labelledby="title desc">
<title id="title">Состояния и разрешённая операция</title><desc id="desc">Четыре значения StudentStatus. Только ACTIVE и ACADEMIC_LEAVE могут перейти в EXPELLED через expel. Для GRADUATED переход не показан.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="525" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Состояния и разрешённая операция</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#65717d" text-anchor="start">StudentStatus ограничивает значения. Student контролирует переходы.</text><rect x="40" y="140" width="350" height="76" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="215" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">ACTIVE</text><rect x="40" y="280" width="350" height="76" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="215" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="400" fill="#26323d" text-anchor="middle">ACADEMIC_LEAVE</text><rect x="710" y="210" width="350" height="76" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="885" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">EXPELLED</text><path d="M390 178 H500 V248 H705" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M390 318 H500 V248" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="560" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">expel()</text><rect x="710" y="350" width="350" height="76" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="885" y="397" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">GRADUATED</text><text x="40" y="409" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">Другие переходы</text><text x="40" y="440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">в примере не реализованы.</text><text x="40" y="491" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Показаны только переходы expel(), а не полный жизненный цикл студента.</text>
</svg>
