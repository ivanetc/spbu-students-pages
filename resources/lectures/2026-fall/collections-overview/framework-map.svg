<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">Основные контракты Collections Framework</title><desc id="desc">Упрощённые отношения подтипов: List, Set и Queue являются подтипами Collection, Deque — Queue. Map не является Collection. Промежуточные Sequenced-интерфейсы намеренно опущены.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="630" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Основные контракты Collections Framework</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Стрелка ведёт от подтипа к надтипу. Реализации здесь не показаны.</text><rect x="360" y="130" width="250" height="70" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="485" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">Collection&lt;E&gt;</text><rect x="40" y="290" width="220" height="70" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="150" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">List&lt;E&gt;</text><rect x="370" y="290" width="220" height="70" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="480" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">Set&lt;E&gt;</text><rect x="700" y="290" width="220" height="70" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="810" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">Queue&lt;E&gt;</text><path d="M150 290 V240 H435 V205" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="290" x2="480" y2="205" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M810 290 V240 H535 V205" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="700" y="430" width="220" height="70" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="810" y="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">Deque&lt;E&gt;</text><line x1="810" y1="430" x2="810" y2="365" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="820" y="130" width="240" height="70" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="940" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#26323d" text-anchor="middle">Map&lt;K,V&gt;</text><text x="940" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#26323d" text-anchor="middle">Отдельный контракт</text><text x="40" y="428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">List — позиции и повторы</text><text x="40" y="467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">Set — уникальные элементы</text><text x="40" y="506" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">Map — ключи и значения</text><text x="40" y="560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Упрощённая карта отношений подтипов, не полная иерархия Java 26.</text><text x="40" y="594" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Промежуточные интерфейсы Sequenced* и прочие ветви опущены.</text>
</svg>
