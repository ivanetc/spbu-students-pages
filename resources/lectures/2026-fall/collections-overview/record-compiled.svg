<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Компиляция record UniversityGroup и запрет наследования от final-класса</title>
<desc id="desc">javac компилирует public record UniversityGroup с компонентом String name в classfile. Концептуально показаны public final класс, superclass java.lang.Record, private final поле, public конструктор и accessor, методы значения и record-метаданные. Иерархия ведёт от final UniversityGroup через abstract Record к Object. Попытка объявить подкласс UniversityGroup перечёркнута из-за final. Это схема состава classfile, не Java-исходник и не полный дамп инструкций.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="650" fill="#fbfcfd"/><rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#26323d" font-weight="650" text-anchor="start">Record после компиляции: класс, компоненты и final</text><rect x="40" y="112" width="360" height="132" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="62" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="650" text-anchor="start">UniversityGroup.java</text><text x="62" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#26323d" font-weight="400" text-anchor="start">public record UniversityGroup</text><text x="62" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">(String name) { ... }</text><line x1="410" y1="180" x2="490" y2="180" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="middle">javac</text><rect x="505" y="92" width="555" height="354" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="529" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#26323d" font-weight="650" text-anchor="start">UniversityGroup.class</text><text x="529" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#65717d" font-weight="400" text-anchor="start">Состав classfile — схематично</text><text x="529" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">public final class UniversityGroup</text><text x="553" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">extends java.lang.Record</text><text x="529" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">private final String name;</text><text x="529" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">public UniversityGroup(String name)</text><text x="529" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">public String name()</text><text x="529" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#26323d" font-weight="400" text-anchor="start">public final boolean equals(Object other)</text><text x="529" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">public final int hashCode()</text><text x="529" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="start">public final String toString()</text><text x="529" y="430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#26323d" font-weight="400" text-anchor="start">Record-метаданные: name : String</text><text x="40" y="294" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#26323d" font-weight="400" text-anchor="start">Результат — class-файл,</text><text x="40" y="326" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#26323d" font-weight="400" text-anchor="start">а не сгенерированный</text><text x="40" y="358" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#26323d" font-weight="400" text-anchor="start">Java-исходник.</text><text x="40" y="466" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#65717d" font-weight="400" text-anchor="start">Наследование: стрелка ведёт к superclass</text><rect x="40" y="490" width="175" height="70" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="127" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#26323d" font-weight="400" text-anchor="middle">Object</text><rect x="305" y="490" width="250" height="70" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="430" y="519" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#26323d" font-weight="400" text-anchor="middle">java.lang.Record</text><text x="430" y="545" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#26323d" font-weight="400" text-anchor="middle">abstract</text><rect x="645" y="490" width="415" height="70" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="852" y="519" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#26323d" font-weight="400" text-anchor="middle">UniversityGroup</text><text x="852" y="545" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#26323d" font-weight="650" text-anchor="middle">final</text><line x1="295" y1="525" x2="223" y2="525" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="635" y1="525" x2="563" y2="525" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="609" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#26323d" font-weight="400" text-anchor="start">class SpecialGroup extends UniversityGroup</text><line x1="37" y1="594" x2="518" y2="616" stroke="#8b5353" stroke-width="2.5"/><text x="565" y="609" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#26323d" font-weight="650" text-anchor="start">final запрещает создание подкласса</text><text x="40" y="641" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#65717d" font-weight="400" text-anchor="start">Методы и метаданные показаны без инструкций байткода и служебных деталей.</text>
</svg>
