<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475" role="img" aria-labelledby="title desc">
<title id="title">Несколько файлов — два пакета</title><desc id="desc">Модель лежит в пакете university.model, запускающий класс — в university.app и импортирует публичный Student. Каталоги показаны относительно src.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="475" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Несколько файлов — два пакета</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Файлы в src/ отражают имена пакетов. Приложение использует публичную модель.</text><rect x="40" y="125" width="460" height="225" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="64" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">src/university/model/</text><text x="64" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">package university.model;</text><text x="64" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">Student.java</text><text x="64" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">StudentStatus.java</text><text x="64" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">UniversityGroup.java</text><rect x="620" y="125" width="440" height="225" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="644" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">src/university/app/</text><text x="644" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">package university.app;</text><text x="644" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">UniversityDemo.java</text><text x="644" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#26323d" text-anchor="start">import university.model.Student;</text><text x="644" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">new Student(...)</text><line x1="620" y1="247" x2="505" y2="247" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="552" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#26323d" text-anchor="middle">import</text><text x="40" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">Полное имя класса: university.app.UniversityDemo</text><text x="40" y="440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Пакет организует имена и доступ; он не создаёт отдельный процесс.</text>
</svg>
