<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">От ручного value-класса к record</title><desc id="desc">Поля, конструктор, accessor и методы значения ручного класса сопоставлены с record UniversityGroup. Проверку выполняет компактный конструктор. Неизменяемость компонентов поверхностная.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="520" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">От ручного value-класса к record</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#65717d" text-anchor="start">Сначала выбираем смысл значения, затем сокращаем повторяющийся код.</text><rect x="40" y="130" width="410" height="270" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="64" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">final class UniversityGroup</text><text x="64" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">private final String name;</text><text x="64" y="258" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">конструктор с проверкой</text><text x="64" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">getName()</text><text x="64" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">equals / hashCode / toString</text><line x1="464" y1="266" x2="600" y2="266" stroke="#64717d" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="532" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#26323d" text-anchor="middle">record</text><rect x="615" y="130" width="445" height="270" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="639" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">record UniversityGroup</text><text x="639" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">(String name)</text><text x="639" y="258" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">компактный конструктор</text><text x="639" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#26323d" text-anchor="start">name()</text><text x="639" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">методы значения — автоматически</text><text x="40" y="447" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">Равенство: тот же record-тип и равные компоненты.</text><text x="40" y="486" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">final-компонент фиксирует ссылку, но не замораживает вложенный объект.</text>
</svg>
