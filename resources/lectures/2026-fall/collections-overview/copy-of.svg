<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625" role="img" aria-labelledby="title desc">
<title id="title">Два списка — общие элементы</title><desc id="desc">У participants и snapshot отдельное представление состава списка, но ссылки ведут к тем же объектам Иван и Анна. List.copyOf не выполняет глубокое копирование и может переиспользовать уже неизменяемый список.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64717d"/></marker></defs>
<rect width="1100" height="625" fill="#fbfcfd"/>
<rect x="32" y="30" width="6" height="30" rx="3" fill="url(#accent)"/>
<text x="52" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#26323d" text-anchor="start">Два списка — общие элементы</text><text x="40" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#65717d" text-anchor="start">List.copyOf фиксирует состав списка, но не копирует объекты Student.</text><rect x="40" y="140" width="290" height="150" rx="12" fill="#f7f9fb" stroke="#bbc5ce" stroke-width="2"/><text x="64" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">participants</text><text x="64" y="219" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">[ ссылка на Ивана,</text><text x="64" y="254" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">  ссылка на Анну ]</text><rect x="40" y="385" width="290" height="150" rx="12" fill="#f3faf8" stroke="#157d79" stroke-width="2"/><text x="64" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="400" fill="#26323d" text-anchor="start">snapshot</text><text x="64" y="464" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">[ ссылка на Ивана,</text><text x="64" y="499" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#26323d" text-anchor="start">  ссылка на Анну ]</text><rect x="660" y="140" width="400" height="160" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="684" y="182" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#26323d" text-anchor="start">Student: Иван</text><text x="684" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">status: ACTIVE</text><text x="684" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#26323d" text-anchor="start">→ EXPELLED после expel()</text><rect x="660" y="385" width="400" height="110" rx="12" fill="#fff" stroke="#bbc5ce" stroke-width="2"/><text x="684" y="428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#26323d" text-anchor="start">Student: Анна</text><text x="684" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#26323d" text-anchor="start">status: ACTIVE</text><path d="M330 210 H460 V200 H655" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 245 H420 V440 H655" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 455 H530 V260 H655" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 490 H570 V465 H655" fill="none" stroke="#64717d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="584" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#65717d" text-anchor="start">Структуру snapshot менять нельзя. Изменение Ивана видно из обоих списков.</text>
</svg>
