<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient></defs><rect width="1100" height="460" fill="#fafbfc"/><rect x="34" y="28" width="6" height="32" rx="3" fill="#155799"/><text x="56" y="53" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">Форму поведения задают вход и результат</text><text x="56" y="82" font-family="Arial" font-size="17" fill="#59656d">Название метода вторично: сначала прочитайте сигнатуру.</text>
  <g font-family="Arial"><rect x="55" y="125" width="230" height="190" rx="18" fill="#fff" stroke="#155799" stroke-width="2"/><text x="170" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#25313a">Predicate&lt;T&gt;</text><text x="170" y="211" text-anchor="middle" font-family="monospace" font-size="22" fill="#155799">T → boolean</text><text x="170" y="254" text-anchor="middle" font-size="18" fill="#59656d">test(T)</text><text x="170" y="285" text-anchor="middle" font-size="16" fill="#59656d">оставить?</text>
  <rect x="310" y="125" width="230" height="190" rx="18" fill="#fff" stroke="#159957" stroke-width="2"/><text x="425" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#25313a">Function&lt;T,R&gt;</text><text x="425" y="211" text-anchor="middle" font-family="monospace" font-size="22" fill="#159957">T → R</text><text x="425" y="254" text-anchor="middle" font-size="18" fill="#59656d">apply(T)</text><text x="425" y="285" text-anchor="middle" font-size="16" fill="#59656d">преобразовать</text>
  <rect x="565" y="125" width="230" height="190" rx="18" fill="#fff" stroke="#7c8991" stroke-width="2"/><text x="680" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#25313a">Consumer&lt;T&gt;</text><text x="680" y="211" text-anchor="middle" font-family="monospace" font-size="22" fill="#59656d">T → void</text><text x="680" y="254" text-anchor="middle" font-size="18" fill="#59656d">accept(T)</text><text x="680" y="285" text-anchor="middle" font-size="16" fill="#59656d">выполнить эффект</text>
  <rect x="820" y="125" width="230" height="190" rx="18" fill="#fff" stroke="#7c8991" stroke-width="2"/><text x="935" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#25313a">Supplier&lt;T&gt;</text><text x="935" y="211" text-anchor="middle" font-family="monospace" font-size="22" fill="#59656d">() → T</text><text x="935" y="254" text-anchor="middle" font-size="18" fill="#59656d">get()</text><text x="935" y="285" text-anchor="middle" font-size="16" fill="#59656d">получить лениво</text></g>
  <rect x="312" y="355" width="476" height="58" rx="14" fill="url(#a)"/><text x="550" y="391" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Predicate.and(...) → новый Predicate</text>
