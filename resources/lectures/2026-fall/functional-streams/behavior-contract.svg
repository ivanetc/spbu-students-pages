<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#159957"/></marker></defs>
  <rect width="1100" height="430" fill="#fafbfc"/><rect x="34" y="28" width="6" height="32" rx="3" fill="#155799"/>
  <text x="56" y="53" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">Один контракт — сменные правила</text>
  <text x="56" y="82" font-family="Arial" font-size="17" fill="#59656d">Метод знает форму вызова, но не конкретное условие.</text>
  <rect x="55" y="155" width="190" height="110" rx="16" fill="#eef4f8" stroke="#155799" stroke-width="2"/><text x="150" y="201" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#25313a">Student</text><text x="150" y="230" text-anchor="middle" font-family="Arial" font-size="17" fill="#59656d">вход</text>
  <path d="M245 210H365" stroke="#159957" stroke-width="4" marker-end="url(#m)"/>
  <rect x="380" y="120" width="350" height="180" rx="18" fill="#fff" stroke="url(#a)" stroke-width="3"/><text x="555" y="160" text-anchor="middle" font-family="monospace" font-size="23" font-weight="700" fill="#25313a">matches(student, rule)</text><text x="555" y="192" text-anchor="middle" font-family="Arial" font-size="17" fill="#155799">вызывает rule.test(student)</text>
  <rect x="410" y="220" width="95" height="42" rx="10" fill="#eaf2f7"/><text x="458" y="247" text-anchor="middle" font-family="Arial" font-size="16" fill="#25313a">active</text><rect x="515" y="220" width="105" height="42" rx="10" fill="#edf7f2"/><text x="568" y="247" text-anchor="middle" font-family="Arial" font-size="16" fill="#25313a">avg ≥ 4.5</text><rect x="630" y="220" width="65" height="42" rx="10" fill="#f1f3f5"/><text x="663" y="247" text-anchor="middle" font-family="Arial" font-size="16" fill="#25313a">Б11</text><text x="555" y="286" text-anchor="middle" font-family="Arial" font-size="15" fill="#59656d">один выбранный ScholarshipRule</text>
  <path d="M730 210H845" stroke="#159957" stroke-width="4" marker-end="url(#m)"/><rect x="860" y="155" width="190" height="110" rx="16" fill="#edf7f2" stroke="#159957" stroke-width="2"/><text x="955" y="201" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#25313a">boolean</text><text x="955" y="230" text-anchor="middle" font-family="Arial" font-size="17" fill="#59656d">результат</text>
  <text x="550" y="370" text-anchor="middle" font-family="Arial" font-size="18" fill="#59656d">Меняется реализация правила; сигнатура вызова остаётся той же.</text>
