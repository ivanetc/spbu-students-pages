<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450">
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#159957"/></marker></defs><rect width="1100" height="450" fill="#fafbfc"/><rect x="34" y="25" width="6" height="32" rx="3" fill="#155799"/><text x="56" y="50" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">reduce: один аккумулятор проходит через все значения</text><text x="56" y="78" font-family="Arial" font-size="17" fill="#59656d">Пример: reduce(0, Integer::sum) для оценок 5, 4 и 3.</text>
  <g font-family="Arial" text-anchor="middle"><rect x="55" y="135" width="150" height="80" rx="14" fill="#eef4f8" stroke="#155799" stroke-width="2"/><text x="130" y="168" font-size="18" font-weight="700" fill="#25313a">identity</text><text x="130" y="197" font-family="monospace" font-size="23" fill="#155799">acc = 0</text><rect x="275" y="135" width="190" height="80" rx="14" fill="#fff" stroke="#159957" stroke-width="2"/><text x="370" y="168" font-family="monospace" font-size="20" fill="#25313a">0 + 5</text><text x="370" y="197" font-size="18" fill="#59656d">acc = 5</text><rect x="535" y="135" width="190" height="80" rx="14" fill="#fff" stroke="#159957" stroke-width="2"/><text x="630" y="168" font-family="monospace" font-size="20" fill="#25313a">5 + 4</text><text x="630" y="197" font-size="18" fill="#59656d">acc = 9</text><rect x="795" y="135" width="190" height="80" rx="14" fill="#edf7f2" stroke="#159957" stroke-width="2"/><text x="890" y="168" font-family="monospace" font-size="20" fill="#25313a">9 + 3</text><text x="890" y="197" font-size="18" font-weight="700" fill="#25313a">result = 12</text></g>
  <g stroke="#159957" stroke-width="4" marker-end="url(#m)"><path d="M205 175H265"/><path d="M465 175H525"/><path d="M725 175H785"/></g><g font-family="Arial" text-anchor="middle"><text x="240" y="145" font-size="16" fill="#59656d">grade 5</text><text x="500" y="145" font-size="16" fill="#59656d">grade 4</text><text x="760" y="145" font-size="16" fill="#59656d">grade 3</text></g>
  <rect x="190" y="285" width="720" height="90" rx="16" fill="#fff" stroke="#d8dee3"/><text x="550" y="320" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#25313a">Stream&lt;Integer&gt; → одно Integer</text><text x="550" y="350" text-anchor="middle" font-family="Arial" font-size="17" fill="#59656d">Для параллельной перегруппировки операция должна быть ассоциативной.</text>
</svg>
