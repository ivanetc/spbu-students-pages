  <defs><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#159957"/></marker><marker id="n" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8d989f"/></marker></defs><rect width="1100" height="590" fill="#fafbfc"/><rect x="34" y="25" width="6" height="32" rx="3" fill="#155799"/><text x="56" y="50" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">Optional преобразуем, не распаковывая</text><text x="56" y="78" font-family="Arial" font-size="17" fill="#59656d">Пока результат может отсутствовать, тип остаётся Optional. Окончательное решение — в конце цепочки.</text>
