<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#159957"/></marker></defs><rect width="1100" height="520" fill="#fafbfc"/><rect x="34" y="28" width="6" height="32" rx="3" fill="#155799"/><text x="56" y="53" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">Method reference читается через целевой тип</text><text x="56" y="82" font-family="Arial" font-size="17" fill="#59656d">Слева — эквивалентная лямбда, справа — сокращённая запись.</text>
  <g font-family="Arial" font-size="18"><rect x="55" y="120" width="990" height="75" rx="13" fill="#fff" stroke="#d8dee3"/><text x="85" y="151" font-weight="700" fill="#25313a">static</text><text x="250" y="151" font-family="monospace" fill="#59656d">s → StudentRules.isActive(s)</text><path d="M600 158H690" stroke="#159957" stroke-width="3" marker-end="url(#m)"/><text x="725" y="151" font-family="monospace" fill="#155799">StudentRules::isActive</text><text x="85" y="178" fill="#59656d">Predicate&lt;Student&gt;</text>
  <rect x="55" y="205" width="990" height="75" rx="13" fill="#fff" stroke="#d8dee3"/><text x="85" y="236" font-weight="700" fill="#25313a">bound</text><text x="250" y="236" font-family="monospace" fill="#59656d">s → rule.test(s)</text><path d="M600 243H690" stroke="#159957" stroke-width="3" marker-end="url(#m)"/><text x="725" y="236" font-family="monospace" fill="#155799">rule::test</text><text x="85" y="263" fill="#59656d">объект rule уже выбран</text>
  <rect x="55" y="290" width="990" height="75" rx="13" fill="#fff" stroke="#d8dee3"/><text x="85" y="321" font-weight="700" fill="#25313a">unbound</text><text x="250" y="321" font-family="monospace" fill="#59656d">s → s.name()</text><path d="M600 328H690" stroke="#159957" stroke-width="3" marker-end="url(#m)"/><text x="725" y="321" font-family="monospace" fill="#155799">Student::name</text><text x="85" y="348" fill="#59656d">первый параметр становится receiver</text>
  <rect x="55" y="375" width="990" height="75" rx="13" fill="#fff" stroke="#d8dee3"/><text x="85" y="406" font-weight="700" fill="#25313a">constructor</text><text x="250" y="406" font-family="monospace" fill="#59656d">(n,g) → new CourseResult(n,g)</text><path d="M600 413H690" stroke="#159957" stroke-width="3" marker-end="url(#m)"/><text x="725" y="406" font-family="monospace" fill="#155799">CourseResult::new</text><text x="85" y="433" fill="#59656d">BiFunction&lt;String,Integer,CourseResult&gt;</text></g>
  <text x="550" y="487" text-anchor="middle" font-family="Arial" font-size="18" fill="#59656d">Количество параметров определяет целевой контракт, а не возможность использовать ::</text>
</svg>
