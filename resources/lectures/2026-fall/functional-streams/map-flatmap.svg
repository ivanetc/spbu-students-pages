<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <defs><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#159957"/></marker><marker id="n" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c8991"/></marker></defs>
  <rect width="1100" height="650" fill="#fafbfc"/><rect x="34" y="25" width="6" height="32" rx="3" fill="#155799"/><text x="56" y="50" font-family="Arial" font-size="27" font-weight="700" fill="#25313a">Один источник, две разные функции</text><text x="56" y="78" font-family="Arial" font-size="17" fill="#59656d">У каждого Student поле results имеет тип List&lt;CourseResult&gt;.</text>
  <rect x="55" y="105" width="990" height="135" rx="18" fill="#eef4f8" stroke="#155799" stroke-width="2"/><text x="85" y="135" font-family="monospace" font-size="17" font-weight="700" fill="#155799">Stream&lt;Student&gt;</text><g font-family="Arial" text-anchor="middle"><rect x="95" y="155" width="270" height="58" rx="11" fill="#fff" stroke="#9db2c2"/><text x="170" y="180" font-size="17" font-weight="700" fill="#25313a">Student A</text><text x="285" y="180" font-size="15" fill="#59656d">results = [R1, R2]</text><rect x="415" y="155" width="270" height="58" rx="11" fill="#fff" stroke="#9db2c2"/><text x="490" y="180" font-size="17" font-weight="700" fill="#25313a">Student B</text><text x="605" y="180" font-size="15" fill="#59656d">results = [R3]</text><rect x="735" y="155" width="270" height="58" rx="11" fill="#fff" stroke="#9db2c2"/><text x="810" y="180" font-size="17" font-weight="700" fill="#25313a">Student C</text><text x="925" y="180" font-size="15" fill="#59656d">results = []</text></g>
  <path d="M300 240V270H235V300" fill="none" stroke="#7c8991" stroke-width="3" marker-end="url(#n)"/><path d="M800 240V430H235V460" fill="none" stroke="#159957" stroke-width="4" marker-end="url(#g)"/>
  <rect x="75" y="305" width="320" height="92" rx="15" fill="#fff" stroke="#7c8991" stroke-width="2"/><text x="235" y="340" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#25313a">map(Student::results)</text><text x="235" y="370" text-anchor="middle" font-family="Arial" font-size="16" fill="#59656d">каждый Student → один List</text><path d="M395 351H480" stroke="#7c8991" stroke-width="3" marker-end="url(#n)"/><rect x="495" y="290" width="550" height="122" rx="16" fill="#fff" stroke="#7c8991" stroke-width="2"/><text x="770" y="320" text-anchor="middle" font-family="monospace" font-size="17" fill="#59656d">Stream&lt;List&lt;CourseResult&gt;&gt;</text><g font-family="Arial" text-anchor="middle"><rect x="545" y="345" width="125" height="42" rx="9" fill="#f1f3f5"/><text x="608" y="372" font-size="16" fill="#25313a">[R1, R2]</text><rect x="710" y="345" width="105" height="42" rx="9" fill="#f1f3f5"/><text x="763" y="372" font-size="16" fill="#25313a">[R3]</text><rect x="855" y="345" width="80" height="42" rx="9" fill="#f1f3f5"/><text x="895" y="372" font-size="16" fill="#25313a">[]</text></g>
  <rect x="75" y="465" width="320" height="100" rx="15" fill="#fff" stroke="#159957" stroke-width="2"/><text x="235" y="497" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#25313a">flatMap(student →</text><text x="235" y="520" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#25313a">student.results().stream())</text><text x="235" y="548" text-anchor="middle" font-family="Arial" font-size="15" fill="#59656d">каждый List → Stream, затем объединение</text><path d="M395 515H480" stroke="#159957" stroke-width="4" marker-end="url(#g)"/><rect x="495" y="455" width="550" height="120" rx="16" fill="#edf7f2" stroke="#159957" stroke-width="2"/><text x="770" y="486" text-anchor="middle" font-family="monospace" font-size="17" fill="#159957">Stream&lt;CourseResult&gt;</text><g font-family="Arial" text-anchor="middle"><rect x="590" y="515" width="90" height="42" rx="9" fill="#fff"/><text x="635" y="542" font-size="16" fill="#25313a">R1</text><rect x="725" y="515" width="90" height="42" rx="9" fill="#fff"/><text x="770" y="542" font-size="16" fill="#25313a">R2</text><rect x="860" y="515" width="90" height="42" rx="9" fill="#fff"/><text x="905" y="542" font-size="16" fill="#25313a">R3</text></g>
  <text x="550" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#59656d">map оставляет списки элементами Stream; flatMap отдаёт дальше элементы этих списков.</text>
</svg>
