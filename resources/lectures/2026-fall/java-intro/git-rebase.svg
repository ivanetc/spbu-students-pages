<svg xmlns="http://www.w3.org/2000/svg" width="900" height="657" viewBox="0 0 900 657" role="img" aria-labelledby="title desc"><title id="title">Rebase трёх коммитов на main</title><desc id="desc">До main на B, feature на E через C D после A. После rebase feature поверх B созданы новые C-prime D-prime E-prime, main по-прежнему на B, feature на E-prime. Старые коммиты не стираются этой схемой из хранилища, но имя feature больше на них не ведёт.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="657" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="33" font-size="24" fill="#283943" font-weight="600" text-anchor="start">Rebase — повторяем свои изменения на новой основе</text><text x="24" y="64" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Находясь в feature, выполняем git rebase main.</text><text x="24" y="102" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ДО</text><path d="M88 158 H298" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 158 C150 158 174 249 268 249 H650" fill="none" stroke="#159957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="298" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="298" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="268" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="268" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C</text><circle cx="458" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="458" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D</text><circle cx="650" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="650" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E</text><rect x="252" y="113" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="298.0" y="135" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="596" y="282" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="651.0" y="304" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M298 145 V141" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 265 V280" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="165" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">своя правка в main</text><text x="269" y="212" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">три коммита в отдельной ветке</text><path d="M24 338 H876" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="372" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ПОСЛЕ</text><path d="M88 457 H770" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="457" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="463" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="258" cy="457" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="258" y="463" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="428" cy="457" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="428" y="463" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C′</text><circle cx="598" cy="457" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="598" y="463" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D′</text><circle cx="770" cy="457" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="770" y="463" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E′</text><rect x="212" y="406" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="258.0" y="428" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="714" y="406" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="769.0" y="428" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M258 438 V440" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M769 438 V440" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="507" font-size="21" fill="#159957" font-weight="600" text-anchor="middle">C → C′</text><text x="598" y="507" font-size="21" fill="#159957" font-weight="600" text-anchor="middle">D → D′</text><text x="770" y="507" font-size="21" fill="#159957" font-weight="600" text-anchor="middle">E → E′</text><text x="450" y="559" font-size="19" fill="#155799" font-weight="600" text-anchor="middle">Те же изменения применены после B и получили новые идентификаторы.</text><text x="450" y="592" font-size="18" fill="#60737e" font-weight="400" text-anchor="middle">main осталась на B. Имя feature теперь указывает на E′.</text><text x="450" y="625" font-size="18" fill="#60737e" font-weight="400" text-anchor="middle">Старые C, D, E больше не входят в историю feature.</text></g></svg>