<svg xmlns="http://www.w3.org/2000/svg" width="900" height="912" viewBox="0 0 900 912" role="img" aria-labelledby="title desc"><title id="title">Коммиты снизу вверх и версии кода</title><desc id="desc">Снизу коммит 1: сравнение value &gt; 20. Над ним коммит 2: value &gt;= 20. Наверху коммит 3: value &gt;= threshold и параметр threshold. Рядом с каждым коммитом своя карточка-снимок README.md и Python-кода. Имя main указывает на последний коммит.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="912" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="34" font-size="24" fill="#283943" font-weight="600" text-anchor="start">История — последовательность сохранённых версий</text><text x="24" y="63" font-size="18" fill="#60737e" font-weight="400" text-anchor="start">Читаем снизу вверх: каждый новый коммит добавляет следующий «выпуск».</text><path d="M161 680 V179" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 706 V131" fill="none" stroke="#60737e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="27" y="105" font-size="16" fill="#60737e" font-weight="400" text-anchor="start">Новее</text><rect x="104" y="92" width="114" height="32" rx="6" fill="#155799" stroke="none"/><text x="161.0" y="114" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><path d="M161 124 V150" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="161" cy="170" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="161" y="176" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">3</text><text x="134" y="176" font-size="18" fill="#155799" font-weight="600" text-anchor="end">Коммит 3</text><path d="M179 170 H291" fill="none" stroke="#d5e0e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="314" y="162" width="552" height="199" rx="12" fill="#e9eff2" stroke="#d5e0e5"/><rect x="308" y="156" width="552" height="199" rx="12" fill="#f4f7f8" stroke="#d5e0e5"/><rect x="302" y="150" width="552" height="199" rx="12" fill="white" stroke="#159957"/><text x="322" y="180" font-size="21" fill="#283943" font-weight="600" text-anchor="start">Порог стал параметром</text><text x="322" y="210" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">README.md: не ниже заданного порога</text><path d="M322 225 H834" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="254" font-size="16" fill="#155799" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">report.py</text><text x="322" y="287" font-size="18" fill="#283943" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">def is_at_least(value, threshold):</text><text x="322" y="320" font-size="18" fill="#159957" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">    return value &gt;= threshold</text><circle cx="161" cy="414" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="161" y="420" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">2</text><text x="134" y="420" font-size="18" fill="#155799" font-weight="600" text-anchor="end">Коммит 2</text><path d="M179 414 H291" fill="none" stroke="#d5e0e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="314" y="406" width="552" height="199" rx="12" fill="#e9eff2" stroke="#d5e0e5"/><rect x="308" y="400" width="552" height="199" rx="12" fill="#f4f7f8" stroke="#d5e0e5"/><rect x="302" y="394" width="552" height="199" rx="12" fill="white" stroke="#d5e0e5"/><text x="322" y="424" font-size="21" fill="#283943" font-weight="600" text-anchor="start">Включили границу</text><text x="322" y="454" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">README.md: не ниже 20 градусов</text><path d="M322 469 H834" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="498" font-size="16" fill="#155799" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">report.py</text><text x="322" y="531" font-size="18" fill="#283943" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">def is_at_least(value):</text><text x="322" y="564" font-size="18" fill="#159957" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">    return value &gt;= 20</text><circle cx="161" cy="658" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="161" y="664" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">1</text><text x="134" y="664" font-size="18" fill="#155799" font-weight="600" text-anchor="end">Коммит 1</text><path d="M179 658 H291" fill="none" stroke="#d5e0e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="314" y="650" width="552" height="199" rx="12" fill="#e9eff2" stroke="#d5e0e5"/><rect x="308" y="644" width="552" height="199" rx="12" fill="#f4f7f8" stroke="#d5e0e5"/><rect x="302" y="638" width="552" height="199" rx="12" fill="white" stroke="#d5e0e5"/><text x="322" y="668" font-size="21" fill="#283943" font-weight="600" text-anchor="start">Начальная версия</text><text x="322" y="698" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">README.md: выше 20 градусов</text><path d="M322 713 H834" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="742" font-size="16" fill="#155799" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">report.py</text><text x="322" y="775" font-size="18" fill="#283943" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">def is_at_least(value):</text><text x="322" y="808" font-size="18" fill="#283943" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">    return value &gt; 20</text><text x="450" y="886" font-size="17" fill="#60737e" font-weight="400" text-anchor="middle">У каждого «выпуска» есть свой снимок. Предыдущие версии остаются в истории.</text></g></svg>