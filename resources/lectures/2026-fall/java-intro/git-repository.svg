<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Локальный и удалённый репозиторий</title><desc id="desc">В папке temperature-report на компьютере лежат служебная папка .git, уже сохранённые README.md и report.py и неотслеживаемый notes.txt. После push удалённый репозиторий содержит те же коммиты и снимки README.md и report.py, но не notes.txt. Удалённый список файлов показывает снимок, а не рабочую папку сервера.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="700" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="33" font-size="24" fill="#283943" font-weight="600" text-anchor="start">Репозиторий хранит историю внутри папки проекта</text><text x="24" y="62" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Показано состояние после отправки коммитов на сервер.</text><rect x="18" y="86" width="506" height="526" rx="12" fill="#f8fafb" stroke="#d5e0e5"/><text x="40" y="121" font-size="22" fill="#283943" font-weight="600" text-anchor="start">Ваш компьютер</text><rect x="38" y="143" width="466" height="449" rx="12" fill="white" stroke="#d5e0e5"/><text x="60" y="176" font-size="21" fill="#283943" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">temperature-report/</text><rect x="58" y="197" width="426" height="108" rx="12" fill="#edf6f8" stroke="#155799"/><path d="M77 218 v-6 h8 l4 5 h10 v26 h-22 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M89 212 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="107" y="235" font-size="21" fill="#155799" font-weight="400" text-anchor="start">.git/</text><text x="77" y="270" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">История, снимки, индекс, имена веток</text><circle cx="369" cy="229" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="369" y="235" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">1</text><path d="M385 229 H434" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="451" cy="229" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="451" y="235" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">2</text><rect x="58" y="324" width="426" height="130" rx="12" fill="#f1f8f4" stroke="#159957"/><text x="77" y="350" font-size="17" fill="#159957" font-weight="600" text-anchor="start">Уже включены в историю</text><path d="M78 365 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 365 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="388" font-size="19" fill="#155799" font-weight="400" text-anchor="start">README.md</text><path d="M78 403 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 403 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="426" font-size="19" fill="#155799" font-weight="400" text-anchor="start">report.py</text><rect x="58" y="475" width="426" height="96" rx="12" fill="#fafafa" stroke="#d5e0e5" stroke-dasharray="6 5"/><text x="77" y="503" font-size="17" fill="#60737e" font-weight="600" text-anchor="start">Ещё не добавлен в Git</text><path d="M78 520 h12 l6 6 v20 h-18 Z" fill="none" stroke="#60737e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 520 v6 h6" fill="none" stroke="#60737e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="543" font-size="19" fill="#60737e" font-weight="400" text-anchor="start">notes.txt</text><rect x="654" y="86" width="228" height="526" rx="12" fill="#f8fafb" stroke="#d5e0e5"/><text x="676" y="121" font-size="22" fill="#283943" font-weight="600" text-anchor="start">Сервер</text><rect x="670" y="151" width="196" height="157" rx="12" fill="#edf6f8" stroke="#155799"/><text x="686" y="179" font-size="20" fill="#283943" font-weight="600" text-anchor="start">Репозиторий</text><text x="686" y="208" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Та же история</text><circle cx="712" cy="258" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="712" y="264" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">1</text><path d="M728 258 H808" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="824" cy="258" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="824" y="264" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">2</text><path d="M486 247 H651" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="565" y="228" font-size="21" fill="#155799" font-weight="600" text-anchor="middle">push</text><text x="565" y="281" font-size="16" fill="#60737e" font-weight="400" text-anchor="middle">коммиты</text><text x="679" y="349" font-size="17" fill="#159957" font-weight="600" text-anchor="start">Снимок коммита 2</text><path d="M680 368 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M692 368 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="391" font-size="17" fill="#155799" font-weight="400" text-anchor="start">README.md</text><path d="M680 408 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M692 408 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="431" font-size="17" fill="#155799" font-weight="400" text-anchor="start">report.py</text><text x="679" y="487" font-size="18" fill="#60737e" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">notes.txt</text><text x="679" y="514" font-size="16" fill="#60737e" font-weight="400" text-anchor="start">здесь отсутствует</text><text x="450" y="645" font-size="18" fill="#283943" font-weight="400" text-anchor="middle">Нахождение файла в папке ещё не означает, что его версия сохранена в Git.</text><text x="450" y="675" font-size="18" fill="#155799" font-weight="600" text-anchor="middle">На сервер отправляется история коммитов, а не вся рабочая папка.</text></g></svg>