<svg xmlns="http://www.w3.org/2000/svg" width="900" height="942" viewBox="0 0 900 942" role="img" aria-labelledby="title desc"><title id="title">Области разработки и примеры технологий</title><desc id="desc">Сервер: Java, Kotlin, Python, Go, C#, JavaScript, TypeScript, PHP, C++; Spring Boot. Веб-интерфейсы: HTML, CSS, JavaScript, TypeScript; React, Angular, Vue. Мобильные приложения: Kotlin и Java для Android, Swift для iOS; Flutter с Dart, React Native с JavaScript или TypeScript. Настольные приложения: C++ и Qt, C# и .NET, Java и JavaFX. Машинное обучение: Python и C++, PyTorch. Игры: C++ и Unreal Engine, C# и Unity. Это примеры, а не исключительная привязка языка к области.</desc><defs><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient></defs><rect width="900" height="942" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="30" font-size="24" fill="#293840" font-weight="600" text-anchor="start">Области разработки и примеры технологий</text><text x="24" y="56" font-size="17" fill="#60717a" font-weight="400" text-anchor="start">Языки и инструменты встречаются в нескольких областях; список не исчерпывающий.</text><rect x="14" y="80" width="426" height="254" rx="12" fill="#f5faf9" stroke="url(#accent)"/><text x="36" y="112" font-size="15" fill="#155799" font-weight="600" text-anchor="start">01</text><text x="73" y="113" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Серверная разработка</text><text x="36" y="140" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Логика приложения, данные, запросы</text><path d="M36 157 H418" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="188" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ЯЗЫКИ</text><rect x="36" y="200" width="65" height="30" rx="6" fill="url(#accent)" stroke="none"/><text x="68" y="221" font-size="18" fill="white" font-weight="600" text-anchor="middle">Java</text><text x="113" y="221" font-size="18" fill="#293840" font-weight="400" text-anchor="start">Kotlin · Python · Go · C#</text><text x="36" y="254" font-size="18" fill="#293840" font-weight="400" text-anchor="start">JavaScript / TypeScript · PHP · C++</text><text x="36" y="288" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ПРИМЕР ИНСТРУМЕНТА</text><text x="36" y="315" font-size="18" fill="#293840" font-weight="400" text-anchor="start">Spring Boot — приложения на Java</text><rect x="460" y="80" width="426" height="254" rx="12" fill="#fafbfc" stroke="#d6dfe3"/><text x="482" y="112" font-size="15" fill="#7b8b94" font-weight="600" text-anchor="start">02</text><text x="519" y="113" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Веб-интерфейсы</text><text x="482" y="140" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">То, с чем пользователь работает в браузере</text><path d="M482 157 H864" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="482" y="188" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ОСНОВА СТРАНИЦЫ</text><text x="482" y="216" font-size="17" fill="#293840" font-weight="400" text-anchor="start">HTML — структура · CSS — оформление</text><text x="482" y="249" font-size="18" fill="#293840" font-weight="400" text-anchor="start">ЯЗЫКИ: JavaScript / TypeScript</text><text x="482" y="288" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ИНСТРУМЕНТЫ ИНТЕРФЕЙСА</text><text x="482" y="315" font-size="18" fill="#293840" font-weight="400" text-anchor="start">React · Angular · Vue</text><rect x="14" y="354" width="426" height="254" rx="12" fill="#fafbfc" stroke="#d6dfe3"/><text x="36" y="386" font-size="15" fill="#7b8b94" font-weight="600" text-anchor="start">03</text><text x="73" y="387" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Мобильные приложения</text><text x="36" y="414" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Android, iOS и общий код для платформ</text><path d="M36 431 H418" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="463" font-size="18" fill="#293840" font-weight="400" text-anchor="start">Android: Kotlin, Java</text><text x="36" y="492" font-size="18" fill="#293840" font-weight="400" text-anchor="start">iOS: Swift</text><text x="36" y="525" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ОБЩИЙ КОД ДЛЯ ANDROID И iOS</text><text x="36" y="555" font-size="18" fill="#293840" font-weight="400" text-anchor="start">Flutter → Dart</text><text x="36" y="584" font-size="17" fill="#293840" font-weight="400" text-anchor="start">React Native → JavaScript / TypeScript</text><rect x="460" y="354" width="426" height="254" rx="12" fill="#fafbfc" stroke="#d6dfe3"/><text x="482" y="386" font-size="15" fill="#7b8b94" font-weight="600" text-anchor="start">04</text><text x="519" y="387" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Настольные приложения</text><text x="482" y="414" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Программы с окнами на компьютере</text><path d="M482 431 H864" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="482" y="462" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ПРИМЕРЫ: ЯЗЫК → ИНСТРУМЕНТ</text><text x="482" y="498" font-size="19" fill="#293840" font-weight="400" text-anchor="start">C++ → Qt</text><text x="482" y="534" font-size="19" fill="#293840" font-weight="400" text-anchor="start">C# → .NET</text><text x="482" y="570" font-size="19" fill="#155799" font-weight="600" text-anchor="start">Java → JavaFX</text><rect x="14" y="628" width="426" height="254" rx="12" fill="#fafbfc" stroke="#d6dfe3"/><text x="36" y="660" font-size="15" fill="#7b8b94" font-weight="600" text-anchor="start">05</text><text x="73" y="661" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Машинное обучение</text><text x="36" y="688" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Обучение моделей и обработка данных</text><path d="M36 705 H418" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="736" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ЯЗЫКИ И ИХ РОЛИ</text><text x="36" y="767" font-size="18" fill="#293840" font-weight="400" text-anchor="start">Python — работа с моделями</text><text x="36" y="798" font-size="18" fill="#293840" font-weight="400" text-anchor="start">C++ — вычислительные компоненты</text><text x="36" y="836" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ПРИМЕР ИНСТРУМЕНТА</text><text x="36" y="863" font-size="18" fill="#293840" font-weight="400" text-anchor="start">PyTorch</text><rect x="460" y="628" width="426" height="254" rx="12" fill="#fafbfc" stroke="#d6dfe3"/><text x="482" y="660" font-size="15" fill="#7b8b94" font-weight="600" text-anchor="start">06</text><text x="519" y="661" font-size="22" fill="#293840" font-weight="600" text-anchor="start">Разработка игр</text><text x="482" y="688" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Игровая логика, графика, взаимодействие</text><path d="M482 705 H864" fill="none" stroke="#dee6e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="482" y="736" font-size="13" fill="#60717a" font-weight="600" text-anchor="start">ПРИМЕРЫ: ЯЗЫК → ДВИЖОК</text><text x="482" y="778" font-size="19" fill="#293840" font-weight="400" text-anchor="start">C++ → Unreal Engine</text><text x="482" y="818" font-size="19" fill="#293840" font-weight="400" text-anchor="start">C# → Unity</text><text x="482" y="860" font-size="16" fill="#60717a" font-weight="400" text-anchor="start">Движок даёт готовую основу для игры.</text><path d="M24 915 H62" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="921" font-size="18" fill="#293840" font-weight="400" text-anchor="start">В нашем курсе: Java → основы языка → серверные приложения.</text></g></svg>