<svg xmlns="http://www.w3.org/2000/svg" width="900" height="365" viewBox="0 0 900 365" role="img" aria-labelledby="title desc"><title id="title">Разработка как цикл изменений</title><desc id="desc">Задача, решение и код, сборка и запуск, проверка и ревью, выпуск, обратная связь. Обратная связь возвращает к задаче.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#657b86" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="65" y="35" width="225" height="95" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="177.5" y="82.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Задача</text><text x="177.5" y="109.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">договориться о результате</text><rect x="350" y="35" width="225" height="95" rx="10" fill="#f1f8f7" stroke="url(#accent)" stroke-width="2"/><text x="462.5" y="82.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Решение и код</text><text x="462.5" y="109.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">внести изменение</text><rect x="635" y="35" width="225" height="95" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="747.5" y="82.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Сборка и запуск</text><text x="747.5" y="109.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">выполнить программу</text><rect x="635" y="210" width="225" height="95" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="747.5" y="257.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Проверка и ревью</text><text x="747.5" y="284.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">разобраться в изменении</text><rect x="350" y="210" width="225" height="95" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="462.5" y="257.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Выпуск</text><text x="462.5" y="284.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">передать готовую версию</text><rect x="65" y="210" width="225" height="95" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="177.5" y="257.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Обратная связь</text><text x="177.5" y="284.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">уточнить следующую задачу</text><path d="M290 82 H348" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 82 H633" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M747 130 V208" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 257 H577" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 257 H292" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M65 257 H27 V82 H63" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="343" font-size="17" fill="#58656d" text-anchor="middle" font-weight="400">Обратная связь помогает выбрать следующее изменение.</text></g></svg>