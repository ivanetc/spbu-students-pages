<svg xmlns="http://www.w3.org/2000/svg" width="900" height="694" viewBox="0 0 900 694" role="img" aria-labelledby="title desc"><title id="title">Merge ветки с тремя коммитами</title><desc id="desc">До: A общий предок, main на B, feature содержит C D E и указывает на E. После merge из main новый M имеет родителей B и E, main указывает на M; feature остаётся на E. Линии показывают родство, слева старые коммиты.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="694" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="33" font-size="24" fill="#283943" font-weight="600" text-anchor="start">Merge — объединяем две линии истории</text><text x="24" y="64" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Находясь в main, выполняем git merge feature.</text><text x="24" y="102" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ДО</text><path d="M88 158 H298" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 158 C150 158 174 249 268 249 H650" fill="none" stroke="#159957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="298" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="298" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="268" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="268" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C</text><circle cx="458" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="458" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D</text><circle cx="650" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="650" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E</text><rect x="252" y="113" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="298.0" y="135" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="596" y="282" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="651.0" y="304" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M298 145 V141" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 265 V280" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="165" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">своя правка в main</text><text x="269" y="212" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">три коммита в отдельной ветке</text><path d="M24 338 H876" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="372" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ПОСЛЕ</text><path d="M88 434 H798" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 434 C150 434 174 530 268 530 H650 C725 530 737 434 798 434" fill="none" stroke="#159957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="298" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="298" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="268" cy="530" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="268" y="536" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C</text><circle cx="458" cy="530" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="458" y="536" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D</text><circle cx="650" cy="530" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="650" y="536" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E</text><circle cx="798" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="798" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">M</text><rect x="752" y="386" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="798.0" y="408" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="596" y="565" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="651.0" y="587" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M798 418 V418" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 546 V563" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="632" font-size="20" fill="#155799" font-weight="600" text-anchor="middle">M — новый коммит слияния, у него два родителя: B и E.</text><text x="450" y="665" font-size="18" fill="#60737e" font-weight="400" text-anchor="middle">Исходные коммиты обеих веток сохраняются. feature остаётся на E.</text></g></svg>