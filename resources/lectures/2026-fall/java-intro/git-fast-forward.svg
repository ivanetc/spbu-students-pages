<svg xmlns="http://www.w3.org/2000/svg" width="900" height="534" viewBox="0 0 900 534" role="img" aria-labelledby="title desc"><title id="title">Как отдельная ветка включается в main</title><desc id="desc">До слияния история содержит A, B, C: main указывает на B, clarify-threshold на C. После git merge clarify-threshold из main оба имени указывают на C. Новый коммит не создаётся, поскольку main не расходилась с этой историей.</desc><defs><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient></defs><rect width="900" height="534" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="32" font-size="23" fill="#293840" font-weight="600" text-anchor="start">Ветка — имя, которое указывает на коммит</text><text x="26" y="66" font-size="17" fill="#60717a" font-weight="400" text-anchor="start">До git merge clarify-threshold: новая правка есть только в отдельной ветке.</text><path d="M130 137 H390 Q470 137 510 176 T690 208" fill="none" stroke="#9cabb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="137" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="130" y="143" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="390" cy="137" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="390" y="143" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="690" cy="208" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="690" y="214" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">C</text><rect x="349" y="86" width="82" height="30" rx="6" fill="url(#accent)" stroke="none"/><text x="390.0" y="107" font-size="17" fill="white" font-weight="600" text-anchor="middle">main</text><path d="M390 116 V121" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="584" y="151" width="212" height="30" rx="6" fill="#eef2f4" stroke="none"/><text x="690.0" y="172" font-size="17" fill="#354650" font-weight="600" text-anchor="middle">clarify-threshold</text><path d="M690 181 V192" fill="none" stroke="#82939d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="177" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Описать задачу</text><text x="390" y="177" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Включить границу</text><text x="690" y="245" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Сделать порог параметром</text><path d="M26 272 H874" fill="none" stroke="#e1e7eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="309" font-size="17" fill="#60717a" font-weight="400" text-anchor="start">После merge: main передвинулась к уже существующему коммиту C.</text><path d="M130 397 H690" fill="none" stroke="#9cabb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="397" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="130" y="403" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="390" cy="397" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="390" y="403" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="690" cy="397" r="14" fill="white" stroke="#155799" stroke-width="3"/><text x="690" y="403" font-size="16" fill="#155799" font-weight="600" text-anchor="middle">C</text><rect x="532" y="340" width="82" height="30" rx="6" fill="url(#accent)" stroke="none"/><text x="573.0" y="361" font-size="17" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="631" y="340" width="212" height="30" rx="6" fill="#eef2f4" stroke="none"/><text x="737.0" y="361" font-size="17" fill="#354650" font-weight="600" text-anchor="middle">clarify-threshold</text><path d="M573 370 V379 H690 V381" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M737 370 V379 H690" fill="none" stroke="#82939d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="437" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Описать задачу</text><text x="390" y="437" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Включить границу</text><text x="690" y="437" font-size="17" fill="#293840" font-weight="400" text-anchor="middle">Сделать порог параметром</text><text x="450" y="482" font-size="19" fill="#155799" font-weight="600" text-anchor="middle">Fast-forward: нового коммита слияния не появляется.</text><text x="450" y="511" font-size="16" fill="#60717a" font-weight="400" text-anchor="middle">Кружки — коммиты, линии — связь с предыдущим коммитом. История читается слева направо.</text></g></svg>