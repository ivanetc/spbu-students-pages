<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Присваивание и копия массива</title><desc id="desc">temperatures и sameTemperatures указывают на один массив. copy указывает на другой массив с копиями примитивных значений. Изменение элемента copy не меняет исходный массив.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#657b86" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="44" font-size="18" fill="#58656d" text-anchor="start" font-weight="400">Переменные хранят ссылки</text><text x="44" y="96" font-size="22" fill="#303840" text-anchor="start" font-weight="400">temperatures</text><text x="44" y="166" font-size="20" fill="#303840" text-anchor="start" font-weight="400">sameTemperatures</text><text x="44" y="256" font-size="22" fill="#303840" text-anchor="start" font-weight="400">copy</text><text x="600" y="35" font-size="18" fill="#58656d" text-anchor="middle" font-weight="400">Элементы массива int[]</text><rect x="400" y="62" width="400" height="62" rx="8" fill="#f1f8f7" stroke="url(#accent)" stroke-width="2"/><text x="440" y="101" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">18</text><text x="520" y="101" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">21</text><path d="M480 62 V124" stroke="#ccd4d8"/><text x="600" y="101" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">16</text><path d="M560 62 V124" stroke="#ccd4d8"/><text x="680" y="101" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">24</text><path d="M640 62 V124" stroke="#ccd4d8"/><text x="760" y="101" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">20</text><path d="M720 62 V124" stroke="#ccd4d8"/><rect x="400" y="220" width="400" height="62" rx="8" fill="#f8fafb" stroke="#ccd4d8" stroke-width="2"/><text x="440" y="259" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">18</text><text x="520" y="259" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">21</text><path d="M480 220 V282" stroke="#ccd4d8"/><text x="600" y="259" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">16</text><path d="M560 220 V282" stroke="#ccd4d8"/><text x="680" y="259" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">24</text><path d="M640 220 V282" stroke="#ccd4d8"/><text x="760" y="259" font-size="23" fill="#303840" text-anchor="middle" font-weight="400">20</text><path d="M720 220 V282" stroke="#ccd4d8"/><path d="M215 90 H398" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><path d="M266 160 H326 V106 H398" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><path d="M111 250 H398" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 126 V218" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="621" y="177" font-size="18" fill="#58656d" text-anchor="start" font-weight="400">clone()</text><text x="450" y="320" font-size="18" fill="#58656d" text-anchor="middle" font-weight="400">sameTemperatures = temperatures — общий массив.</text><text x="450" y="348" font-size="18" fill="#58656d" text-anchor="middle" font-weight="400">copy = temperatures.clone() — отдельные ячейки с копиями значений.</text></g></svg>