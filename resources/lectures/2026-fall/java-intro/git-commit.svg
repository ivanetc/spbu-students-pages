<svg xmlns="http://www.w3.org/2000/svg" width="900" height="687" viewBox="0 0 900 687" role="img" aria-labelledby="title desc"><title id="title">Коммит как единая фиксация</title><desc id="desc">Одна карточка коммита 2 содержит сообщение Включить порог в подсчёт измерений и отображение изменений README.md и report.py относительно коммита 1. В README выше заменено на не ниже, в Python &gt; на &gt;=. Две согласованные правки входят в одну фиксацию; diff вычисляется из снимков.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="687" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="34" font-size="24" fill="#283943" font-weight="600" text-anchor="start">Коммит — одна фиксация согласованного состояния</text><rect x="66" y="71" width="744" height="508" rx="12" fill="white" stroke="#155799"/><rect x="88" y="90" width="140" height="32" rx="6" fill="#155799" stroke="none"/><text x="158.0" y="112" font-size="18" fill="white" font-weight="600" text-anchor="middle">Коммит 2</text><text x="253" y="113" font-size="21" fill="#283943" font-weight="600" text-anchor="start">снимок проекта + описание</text><text x="88" y="156" font-size="14" fill="#60737e" font-weight="600" text-anchor="start">MESSAGE · ЗАЧЕМ СДЕЛАНО ИЗМЕНЕНИЕ</text><text x="88" y="190" font-size="25" fill="#283943" font-weight="600" text-anchor="start">Включить порог в подсчёт измерений</text><path d="M88 214 H786" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="244" font-size="18" fill="#60737e" font-weight="400" text-anchor="start">Изменённые файлы — сравнение с коммитом 1</text><rect x="88" y="263" width="698" height="117" rx="12" fill="#f9fbfc" stroke="#d5e0e5"/><path d="M107 273 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 273 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="137" y="296" font-size="19" fill="#155799" font-weight="400" text-anchor="start">README.md</text><text x="110" y="329" font-size="18" fill="#60737e" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">− Посчитать измерения выше 20 градусов.</text><text x="110" y="360" font-size="18" fill="#159957" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">+ Посчитать измерения не ниже 20 градусов.</text><rect x="88" y="394" width="698" height="117" rx="12" fill="#f9fbfc" stroke="#d5e0e5"/><path d="M107 404 h12 l6 6 v20 h-18 Z" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 404 v6 h6" fill="none" stroke="#155799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="137" y="427" font-size="19" fill="#155799" font-weight="400" text-anchor="start">report.py</text><text x="110" y="460" font-size="18" fill="#60737e" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">− return value &gt; 20</text><text x="110" y="491" font-size="18" fill="#159957" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace" xml:space="preserve">+ return value &gt;= 20</text><text x="88" y="547" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Также: автор, время и ссылка на предыдущий коммит.</text><text x="450" y="629" font-size="20" fill="#155799" font-weight="600" text-anchor="middle">Обе правки зафиксированы вместе под одним идентификатором.</text><text x="450" y="662" font-size="17" fill="#60737e" font-weight="400" text-anchor="middle">Коммит связан со снимком; список изменений Git получает сравнением снимков.</text></g></svg>