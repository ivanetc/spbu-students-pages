<svg xmlns="http://www.w3.org/2000/svg" width="900" height="704" viewBox="0 0 900 704" role="img" aria-labelledby="title desc"><title id="title">Cherry-pick одного изменения</title><desc id="desc">До: общий A, main на B, feature C D E. После cherry-pick D в main создан D-prime после B; исходные C D E и указатель feature сохранены. Пунктир показывает перенос изменения, а не родительскую связь. C и E не копируются.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60737e" stroke-width="1.5"/></marker></defs><rect width="900" height="704" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="33" font-size="24" fill="#283943" font-weight="600" text-anchor="start">Cherry-pick — берём изменение одного коммита</text><text x="24" y="64" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">Находясь в main, выполняем git cherry-pick D.</text><text x="24" y="102" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ДО</text><path d="M88 158 H298" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 158 C150 158 174 249 268 249 H650" fill="none" stroke="#159957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="298" cy="158" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="298" y="164" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="268" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="268" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C</text><circle cx="458" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="458" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D</text><circle cx="650" cy="249" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="650" y="255" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E</text><rect x="252" y="113" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="298.0" y="135" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="596" y="282" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="651.0" y="304" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M298 145 V141" fill="none" stroke="#155799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 265 V280" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="165" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">своя правка в main</text><text x="269" y="212" font-size="17" fill="#60737e" font-weight="400" text-anchor="start">три коммита в отдельной ветке</text><path d="M24 338 H876" fill="none" stroke="#d5e0e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="372" font-size="15" fill="#60737e" font-weight="600" text-anchor="start">ПОСЛЕ</text><path d="M88 434 H770" fill="none" stroke="#155799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 434 C150 434 174 543 268 543 H650" fill="none" stroke="#159957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="88" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">A</text><circle cx="298" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="298" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">B</text><circle cx="770" cy="434" r="16" fill="white" stroke="#155799" stroke-width="3"/><text x="770" y="440" font-size="17" fill="#155799" font-weight="600" text-anchor="middle">D′</text><circle cx="268" cy="543" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="268" y="549" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">C</text><circle cx="458" cy="543" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="458" y="549" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">D</text><circle cx="650" cy="543" r="16" fill="white" stroke="#159957" stroke-width="3"/><text x="650" y="549" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">E</text><rect x="724" y="384" width="92" height="32" rx="6" fill="#155799" stroke="none"/><text x="770.0" y="406" font-size="18" fill="white" font-weight="600" text-anchor="middle">main</text><rect x="596" y="579" width="110" height="32" rx="6" fill="#159957" stroke="none"/><text x="651.0" y="601" font-size="18" fill="white" font-weight="600" text-anchor="middle">feature</text><path d="M650 559 V577" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 532 C570 466 655 496 750 445" fill="none" stroke="#159957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="588" y="463" font-size="17" fill="#159957" font-weight="600" text-anchor="middle">только правка D</text><text x="450" y="641" font-size="19" fill="#155799" font-weight="600" text-anchor="middle">В main появился D′ с изменением из D и новым идентификатором.</text><text x="450" y="674" font-size="18" fill="#60737e" font-weight="400" text-anchor="middle">C и E не переносились. Ветка feature и её коммиты остались на месте.</text></g></svg>