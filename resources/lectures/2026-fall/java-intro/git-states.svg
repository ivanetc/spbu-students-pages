<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">От файла к удалённому репозиторию</title><desc id="desc">git add переносит выбранное содержимое в индекс; commit записывает локальный снимок; push передаёт коммиты на сервер. fetch загружает историю с сервера в локальный репозиторий.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#657b86" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="12" y="35" width="654" height="177" rx="14" fill="none" stroke="#ccd4d8" stroke-dasharray="5 5"/><text x="32" y="24" font-size="17" fill="#58656d" text-anchor="start" font-weight="400">На вашем компьютере</text><text x="779" y="24" font-size="17" fill="#58656d" text-anchor="middle" font-weight="400">На сервере</text><rect x="24" y="105" width="180" height="85" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="114.0" y="147.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Рабочие файлы</text><text x="114.0" y="174.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">редактируем</text><rect x="246" y="105" width="180" height="85" rx="10" fill="#f1f8f7" stroke="url(#accent)" stroke-width="2"/><text x="336.0" y="147.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Индекс</text><text x="336.0" y="174.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">выбираем снимок</text><rect x="468" y="105" width="180" height="85" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="558.0" y="147.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Коммиты</text><text x="558.0" y="174.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">локальная история</text><rect x="690" y="105" width="180" height="85" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="780.0" y="147.5" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">Репозиторий</text><text x="780.0" y="174.5" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">удалённая история</text><path d="M204 147 H244" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="87" font-size="17" fill="#155799" text-anchor="middle" font-weight="400">add</text><path d="M426 147 H466" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><text x="447" y="87" font-size="17" fill="#155799" text-anchor="middle" font-weight="400">commit</text><path d="M648 147 H688" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><text x="669" y="87" font-size="17" fill="#155799" text-anchor="middle" font-weight="400">push</text><path d="M780 192 V253 H560 V192" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="678" y="279" font-size="17" fill="#58656d" text-anchor="middle" font-weight="400">fetch: загрузить историю</text><text x="450" y="318" font-size="17" fill="#58656d" text-anchor="middle" font-weight="400">commit — локально, push — на сервер. После новой правки снова выполните add.</text></g></svg>