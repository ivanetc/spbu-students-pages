<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Компиляция и запуск Java</title><desc id="desc">javac компилирует TemperatureReport.java в байткод TemperatureReport.class; java запускает программу в JVM, первая версия программы печатает 18.</desc><defs><linearGradient id="accent"><stop stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#657b86" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="88" width="255" height="94" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="147.5" y="135.0" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">TemperatureReport.java</text><text x="147.5" y="162.0" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">исходный код</text><rect x="347" y="88" width="255" height="94" rx="10" fill="#f1f8f7" stroke="url(#accent)" stroke-width="2"/><text x="474.5" y="135.0" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">TemperatureReport.class</text><text x="474.5" y="162.0" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">байткод</text><rect x="674" y="88" width="200" height="94" rx="10" fill="#f8fafb" stroke="#ccd4d8" stroke-width="1.4"/><text x="774.0" y="135.0" font-size="20" fill="#303840" text-anchor="middle" font-weight="600">JVM</text><text x="774.0" y="162.0" font-size="16" fill="#58656d" text-anchor="middle" font-weight="400">выполнение программы</text><path d="M275 135 H345" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><text x="311" y="69" font-size="19" fill="#155799" text-anchor="middle" font-weight="400">javac</text><path d="M602 135 H672" fill="none" stroke="#155799" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="69" font-size="19" fill="#155799" text-anchor="middle" font-weight="400">java</text><path d="M774 184 V245 H640" fill="none" stroke="#879299" stroke-width="2" marker-end="url(#arrow)"/><text x="614" y="253" font-size="23" fill="#303840" text-anchor="end" font-weight="400">18</text><text x="450" y="304" font-size="17" fill="#58656d" text-anchor="middle" font-weight="400">IDE помогает выполнить эти шаги; инструменты компиляции и запуска предоставляет JDK.</text></g></svg>