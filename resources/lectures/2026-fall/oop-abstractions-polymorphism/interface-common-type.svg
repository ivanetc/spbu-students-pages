<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Course зависит от общего типа CourseParticipant</title>
  <desc id="desc">Клиент Course использует контракт CourseParticipant. Классы Student, Teacher и Guest независимо реализуют этот интерфейс.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#fff" stroke="#69737d" stroke-width="1.4"/></marker>
    <style>
      .heading{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.label{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.small{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f6b76}.code{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#374151}.box{fill:#fff;stroke:#77828c;stroke-width:1.6;rx:12}.client{fill:#fbfcfd;stroke:#77828c;stroke-width:1.8;rx:14}.contract{fill:#fff;stroke:url(#accent);stroke-width:3;rx:15}.use{fill:none;stroke:#4b5563;stroke-width:2.2;marker-end:url(#arrow)}.impl{fill:none;stroke:#69737d;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#openArrow)}.rule{stroke:#d7dde3;stroke-width:1}
    </style>
  </defs>
  <rect width="1120" height="520" fill="#fff"/>
  <text class="heading" x="560" y="38" text-anchor="middle">Клиент знает контракт, а не перечень реализаций</text>

  <rect class="client" x="60" y="178" width="220" height="126"/>
  <text class="label" x="170" y="215" text-anchor="middle">Course</text>
  <line class="rule" x1="82" y1="232" x2="258" y2="232"/>
  <text class="code" x="170" y="260" text-anchor="middle">notifyParticipants(...)</text>
  <text class="small" x="170" y="286" text-anchor="middle">клиент</text>

  <rect class="contract" x="402" y="145" width="316" height="192"/>
  <text class="small" x="560" y="178" text-anchor="middle">interface</text>
  <text class="label" x="560" y="207" text-anchor="middle">CourseParticipant</text>
  <line class="rule" x1="430" y1="226" x2="690" y2="226"/>
  <text class="code" x="560" y="258" text-anchor="middle">getDisplayName()</text>
  <text class="code" x="560" y="288" text-anchor="middle">receiveMessage(String)</text>
  <text class="small" x="560" y="319" text-anchor="middle">общий тип и контракт</text>

  <path class="use" d="M280 241 C328 241 350 241 402 241"/>
  <text class="small" x="341" y="222" text-anchor="middle">использует</text>

  <g>
    <rect class="box" x="810" y="74" width="244" height="88"/><text class="label" x="932" y="111" text-anchor="middle">Student</text><text class="small" x="932" y="139" text-anchor="middle">свои state и behavior</text>
    <rect class="box" x="810" y="202" width="244" height="88"/><text class="label" x="932" y="239" text-anchor="middle">Teacher</text><text class="small" x="932" y="267" text-anchor="middle">своя реализация</text>
    <rect class="box" x="810" y="330" width="244" height="88"/><text class="label" x="932" y="367" text-anchor="middle">Guest</text><text class="small" x="932" y="395" text-anchor="middle">не обязан быть User</text>
    <path class="impl" d="M810 118 C768 118 760 184 718 190"/><path class="impl" d="M810 246 L718 246"/><path class="impl" d="M810 374 C768 374 760 308 718 301"/>
    <text class="small" x="772" y="174" text-anchor="middle">implements</text>
  </g>

  <g transform="translate(390 450)"><line x1="0" y1="0" x2="48" y2="0" class="use"/><text class="small" x="59" y="5">зависимость клиента</text><line x1="238" y1="0" x2="286" y2="0" class="impl"/><text class="small" x="299" y="5">реализация интерфейса</text></g>
</svg>
