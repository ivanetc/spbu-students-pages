<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Два этапа вызова переопределённого метода</title>
  <desc id="desc">Компилятор проверяет receiveMessage по статическому типу CourseParticipant, а во время выполнения класс объекта Student или Teacher определяет выбранную реализацию.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
    <marker id="accentArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#157a79"/></marker>
    <style>.heading{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.step{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.small{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f6b76}.code{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#374151}.panel{fill:#fbfcfd;stroke:#d7dde3;stroke-width:1.5;rx:14}.call{fill:#fff;stroke:url(#accent);stroke-width:2.8;rx:13}.box{fill:#fff;stroke:#77828c;stroke-width:1.6;rx:11}.flow{fill:none;stroke:#4b5563;stroke-width:2.1;marker-end:url(#arrow)}.runtime{fill:none;stroke:#157a79;stroke-width:2.5;marker-end:url(#accentArrow)}.rule{stroke:#d7dde3;stroke-width:1}</style>
  </defs>
  <rect width="1120" height="620" fill="#fff"/>
  <text class="heading" x="560" y="36" text-anchor="middle">Один call site — два разных вопроса</text>
  <rect class="call" x="304" y="66" width="512" height="66"/>
  <text class="code" x="560" y="106" text-anchor="middle">participant.receiveMessage(message)</text>

  <rect class="panel" x="64" y="184" width="450" height="176"/>
  <text class="step" x="289" y="218" text-anchor="middle">1. Compile time</text>
  <text class="small" x="289" y="250" text-anchor="middle">static type: CourseParticipant</text>
  <rect class="box" x="140" y="274" width="298" height="54"/>
  <text class="code" x="289" y="307" text-anchor="middle">receiveMessage(String) ✓</text>
  <text class="small" x="289" y="346" text-anchor="middle">вызов допустим</text>

  <rect class="panel" x="606" y="184" width="450" height="176"/>
  <text class="step" x="831" y="218" text-anchor="middle">2. Runtime</text>
  <text class="small" x="831" y="250" text-anchor="middle">runtime class текущего объекта</text>
  <rect class="box" x="658" y="274" width="146" height="54"/><text class="code" x="731" y="307" text-anchor="middle">Student</text>
  <rect class="box" x="858" y="274" width="146" height="54"/><text class="code" x="931" y="307" text-anchor="middle">Teacher</text>
  <text class="small" x="831" y="346" text-anchor="middle">выбирается override</text>

  <path class="flow" d="M470 132 C420 151 358 162 310 184"/><path class="flow" d="M650 132 C700 151 762 162 810 184"/>
  <path class="runtime" d="M731 328 C731 387 579 389 426 430"/><path class="runtime" d="M931 328 C931 387 908 395 846 430"/>

  <rect class="box" x="176" y="430" width="360" height="92"/>
  <text class="step" x="356" y="463" text-anchor="middle">Student.receiveMessage(...)</text>
  <line class="rule" x1="204" y1="478" x2="508" y2="478"/>
  <text class="small" x="356" y="505" text-anchor="middle">«Студент Иван Петров получил...»</text>
  <rect class="box" x="584" y="430" width="360" height="92"/>
  <text class="step" x="764" y="463" text-anchor="middle">Teacher.receiveMessage(...)</text>
  <line class="rule" x1="612" y1="478" x2="916" y2="478"/>
  <text class="small" x="764" y="505" text-anchor="middle">«Сообщение для преподавателя...»</text>

  <text class="small" x="560" y="576" text-anchor="middle">Модель относится к overridden instance methods; поля и static methods так не выбираются.</text>
</svg>
