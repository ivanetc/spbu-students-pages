<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Статический тип переменной и класс объекта во время выполнения</title>
  <desc id="desc">Переменная participant имеет статический тип CourseParticipant и хранит ссылку на единственный объект с runtime class Student.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155799"/><stop offset="1" stop-color="#159957"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
    <style>.heading{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.label{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202832}.small{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f6b76}.code{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#374151}.variable{fill:#fbfcfd;stroke:#77828c;stroke-width:1.8;rx:14}.object{fill:#fff;stroke:url(#accent);stroke-width:3;rx:16}.ref{fill:none;stroke:#4b5563;stroke-width:2.4;marker-end:url(#arrow)}.rule{stroke:#d7dde3;stroke-width:1}.note{fill:#f7f8fa;stroke:#d7dde3;stroke-width:1.2;rx:10}</style>
  </defs>
  <rect width="1120" height="460" fill="#fff"/>
  <text class="heading" x="560" y="38" text-anchor="middle">CourseParticipant participant = new Student(...)</text>

  <rect class="variable" x="86" y="125" width="330" height="184"/>
  <text class="small" x="251" y="158" text-anchor="middle">переменная</text>
  <text class="label" x="251" y="190" text-anchor="middle">participant</text>
  <line class="rule" x1="112" y1="208" x2="390" y2="208"/>
  <text class="small" x="130" y="241">static type</text>
  <text class="code" x="130" y="272">CourseParticipant</text>

  <rect class="object" x="704" y="91" width="330" height="252"/>
  <text class="small" x="869" y="126" text-anchor="middle">единственный объект</text>
  <text class="label" x="869" y="158" text-anchor="middle">Student</text>
  <line class="rule" x1="732" y1="178" x2="1006" y2="178"/>
  <text class="small" x="752" y="210">runtime class</text><text class="code" x="910" y="210">Student</text>
  <text class="code" x="752" y="247">name = "Иван Петров"</text>
  <text class="code" x="752" y="278">group = ссылка</text>
  <text class="small" x="869" y="319" text-anchor="middle">объект сохраняет все свои данные</text>

  <path class="ref" d="M416 219 C510 219 608 219 704 219"/>
  <text class="small" x="560" y="196" text-anchor="middle">ссылочное значение</text>

  <rect class="note" x="312" y="374" width="496" height="52"/>
  <text class="small" x="560" y="406" text-anchor="middle">Нет второго объекта, копирования и «объекта интерфейса»</text>
</svg>
